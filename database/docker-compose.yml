name: ibid-agents

services:
  database:
    image: postgres:17-alpine
    container_name: ibid-agents-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ibid
      POSTGRES_DB: ibid_agents
    ports:
      - "127.0.0.1:${IBID_DATABASE_PORT}:5432"
    volumes:
      - records:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibid -d ibid_agents"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  records:
