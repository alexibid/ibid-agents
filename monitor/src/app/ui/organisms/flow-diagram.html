@let flow = drawing();
<div class="flow">
  <svg class="flow__drawing" [attr.width]="flow.width" [attr.height]="height" [attr.viewBox]="'0 0 ' + flow.width + ' ' + height" role="group" aria-label="Passos do fluxo e quem faz cada um">
    <defs>
      <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" class="flow__arrow-head" />
      </marker>
    </defs>

    @for (repair of flow.repairs; track repair.id; let order = $index) {
      <path class="flow__repair" [attr.d]="repairPath(repair.from, repair.to, order)" marker-end="url(#flow-arrow)" />
    }

    @for (link of flow.forward; track link.id) {
      <line
        class="flow__link"
        [attr.x1]="(flow.nodes[link.from]?.x ?? 0) + nodeWidth"
        [attr.y1]="middle"
        [attr.x2]="(flow.nodes[link.to]?.x ?? 0) - 2"
        [attr.y2]="middle"
        marker-end="url(#flow-arrow)"
      />
    }

    @for (node of flow.nodes; track node.id) {
      <g
        [class]="'flow__node flow__node--' + node.state"
        [attr.transform]="'translate(' + node.x + ' 0)'"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Ver o passo ' + labelOf(node)"
        (click)="nodePicked.emit(node.id)"
        (keydown.enter)="nodePicked.emit(node.id)"
      >
        <rect class="flow__box" [attr.y]="nodeTop" [attr.width]="nodeWidth" [attr.height]="nodeHeight" rx="10" />
        <text class="flow__name" [attr.x]="nodeWidth / 2" [attr.y]="middle + 5">{{ labelOf(node) }}</text>
        <line class="flow__stem" [attr.x1]="nodeWidth / 2" [attr.y1]="nodeTop + nodeHeight" [attr.x2]="nodeWidth / 2" [attr.y2]="agentTop" />
        <rect
          [class]="node.byLangGraph ? 'flow__agent flow__agent--langgraph' : 'flow__agent'"
          x="6"
          [attr.y]="agentTop"
          [attr.width]="nodeWidth - 12"
          height="30"
          rx="15"
        />
        <text class="flow__agent-name" [attr.x]="nodeWidth / 2" [attr.y]="agentTop + 20">{{ node.doneBy }}</text>
        @for (called of node.calls ?? []; track called; let row = $index) {
          <text class="flow__call" [attr.x]="nodeWidth / 2" [attr.y]="agentTop + 48 + row * 15">→ {{ called }}</text>
        }
        @for (contract of node.contracts; track contract; let row = $index) {
          <text class="flow__contract" [attr.x]="nodeWidth / 2" [attr.y]="agentTop + 48 + row * 15">{{ contract }}</text>
        }
        @for (contract of node.contractsWhenNeeded; track contract; let row = $index) {
          <text class="flow__contract flow__contract--optional" [attr.x]="nodeWidth / 2" [attr.y]="agentTop + 48 + (node.contracts.length + row) * 15">
            + {{ contract }}
          </text>
        }
      </g>
    }
  </svg>
</div>
